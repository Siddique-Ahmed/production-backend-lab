services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-api-container

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      - MONGO_URI=mongodb://mongodb:27017/ecommerce

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    mem_limit: 512m

    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  mongodb:
    image: mongo:8

    container_name: ecommerce-mongodb

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    mem_limit: 1g

    cpus: "1.0"

volumes:
  mongo-data:
